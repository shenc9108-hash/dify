name: build-web
on:
  push:
    paths: ['web/**', 'packages/**', '.github/workflows/build-web.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build openapi-content-mapper
        run: pnpm --filter @dify/openapi-content-mapper build
      - name: Build web (vinext)
        run: pnpm build:vinext
        working-directory: web
        env:
          # Browser-side calls go to the same origin; the tunnel/reverse proxy
          # forwards /console/api and /api to the Dify API.
          NEXT_PUBLIC_API_PREFIX: /console/api
          NEXT_PUBLIC_PUBLIC_API_PREFIX: /api
          # Must not be empty: config/index.ts returns '' instead of the default.
          NEXT_PUBLIC_SOCKET_URL: wss://di.vddfg99.kdns.fr
          NEXT_PUBLIC_DEPLOY_ENV: PRODUCTION
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 30
